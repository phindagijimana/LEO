site_name: LEO
site_description: Research phenotyping for epilepsy notes
site_url: https://medai.readthedocs.io/
docs_dir: docs_site
repo_url: https://github.com/phindagijimana/LEO
repo_name: GitHub
edit_uri: blob/main/docs/
copyright: Research use only. Synthetic notes unless IRB and approved compute.

# Same family as QSIPrep / Sphinx RTD (left sidebar + page TOC)
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - python
  collapse_navigation: false
  navigation_depth: 3
  titles_only: false
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom

nav:
  - Home: index.md
  - Installation: LEO_HOSTING.md
  - Quick start: QUICKSTART.md
  - Usage: LEO_USER_GUIDE.md
  - Theory and Science: THEORY.md
  - Interpreting results: INTERPRETING_RESULTS.md
  - Literature: LITERATURE.md
  - Routing rules: LEO_ROUTING_RULES.md
  - Design: IMPLEMENTATION.md
  - Weaknesses: WEAKNESSES.md
  - Learning: ACTIVE_LEARNING_PLAN.md
  - Glossary: GLOSSARY.md
  - Container: LEO_CONTAINER.md
  - Research-host deploy: LEO_RESEARCH_DEPLOY.md
  - PHI scan: LEO_PHI.md
  - IS request: LEO_IS_REQUEST.md
  - Third-party licenses: LEO_THIRD_PARTY.md
  - Local deployment: LEO_LOCAL_DEPLOYMENT.md
  - Epic: LEO_EPIC_INTEGRATION.md
  - HPC: HPC_CLI_GUIDE.md
  - CPU and GPU: RESOURCE_MODES.md
  - The record:
    - Documentation map: DOC_MAP.md
    - Evaluation protocol: EVAL_PROTOCOL_LEO.md
    - Bibliography: REFERENCES.md
    - LoRA contract: LORA_FLAT_CONTRACT.md
