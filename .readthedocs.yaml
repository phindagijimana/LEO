# Read the Docs — same pattern as QSIPrep (https://qsiprep.readthedocs.io)
# Import github.com/phindagijimana/LEO at https://readthedocs.org
# The live project slug is medai, so the site stays https://medai.readthedocs.io
# leo.readthedocs.io is a different project. Do not point this build there.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs_site/requirements.txt
