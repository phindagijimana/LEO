# LEO on one GPU workstation. Weights and CDB stay on the host (not in the image).
#
#   docker compose -f docker-compose.leo.yml up
#   open http://127.0.0.1:8085/leo/ui
#
# Requires: NVIDIA Container Toolkit, model_cache/ Med42 snapshot, CDB, .env (UMLS).

services:
  leo:
    build:
      context: .
      dockerfile: Dockerfile.leo
    image: leo:research
    container_name: leo
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8085}:8085"
    env_file:
      - .env
    environment:
      APP_HOME: /app
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      LEO_BLOCK_CLOUD: "1"
      LEO_RESEARCH: "1"
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "8085"
      LEO_LOAD_MED42: "1"
      LEO_REQUIRE_GPU: "1"
    volumes:
      - ./model_cache:/app/model_cache:ro
      - ./data/medcat_cdb_epilepsy:/app/data/medcat_cdb_epilepsy:ro
      # optional: ontology layer (SNOMED / RxNorm are licensed; not in the image)
      # - ./data/ontologies:/app/data/ontologies
      - ./data/leo_jobs:/app/data/leo_jobs
      - ./data/leo_training:/app/data/leo_training
      - ./logs:/app/logs
    gpus: all
    restart: "no"
